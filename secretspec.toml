# Dev-shell / tooling secrets (NOT system secrets — those are sops-nix,
# see modules/secrets). Resolved by `secretspec` from secrets/devshell.yaml:
#
#   secretspec config init                     # once: choose provider below
#   just secrets-edit devshell                 # create/edit the encrypted file
#   secretspec check                           # verify everything resolves
#   secretspec run -- deploy .#apollo          # run with secrets in the env
#
# Provider URI: sops://secrets/devshell.yaml  (age key from SOPS_AGE_KEY_FILE
# or ~/.config/sops/age/keys.txt)

[project]
name = "nixos-config"
revision = "1.0"

[profiles.default]
CACHIX_AUTH_TOKEN = { description = "Push token for the binary cache", required = false }
HCLOUD_TOKEN = { description = "Hetzner Cloud API token (cloud role)", required = false }
GITHUB_TOKEN = { description = "GitHub token for flake fetches / gh", required = false }

[profiles.ci]
GITHUB_TOKEN = { description = "Provided by the workflow", required = true }
