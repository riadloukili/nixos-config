# Recipients. Naming: `user-<name>` for a person's admin age key
# (~/.config/sops/age/keys.txt), `host-<name>` for a machine's key, derived from
# its SSH host key (`ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub`, or
# `just sops-add-host <name> <ip>`). Add a key under `keys:`, then list it
# in the rules that should include it.
#
# Files by scope (hosts decrypt all of them at boot; a user file is also
# readable by that user):
#   secrets/common.yaml         everything
#   secrets/hosts/common.yaml   every host
#   secrets/hosts/<name>.yaml   one host       (rule: [admins, *host-<name>])
#   secrets/users/common.yaml   every user
#   secrets/users/<name>.yaml   one user       (rule: [*user-<name>, hosts the user is on])
keys:
  - &user-riad age1vpwzq7ae6kysut2tu32u4hx799dmt4vdh2klh576pcfqv2rdxves3es9ka
  - &host-eleuthia age190vlwmgk838afm7thk23n74wjvrhrlmrwa6dw8gkh8glawjxcujsnpye78
creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *user-riad
          - *host-eleuthia
  - path_regex: secrets/hosts/common\.yaml$
    key_groups:
      - age:
          - *user-riad
          - *host-eleuthia
  - path_regex: secrets/hosts/eleuthia\.yaml$
    key_groups:
      - age:
          - *user-riad
          - *host-eleuthia
  - path_regex: secrets/users/common\.yaml$
    key_groups:
      - age:
          - *user-riad
          - *host-eleuthia
  - path_regex: secrets/users/riad\.yaml$
    key_groups:
      - age:
          - *user-riad
          - *host-eleuthia
