# Recipients. Naming: `user-<name>` for a person's admin age key
# (~/.config/sops/age/keys.txt), `host-<name>` for a machine's key, derived from
# its SSH host key (`ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub`, or
# `just sops-add-host <name> <ip>`). Add a host under `keys:`, then list it
# (`*host-<name>`) in the rules that should include it.
#
# Per-host secrets (only that host + admin) look like:
#   - path_regex: secrets/apollo\.yaml$
#     key_groups:
#       - age: [*user-riad, *host-apollo]
keys:
  - &user-riad age1vpwzq7ae6kysut2tu32u4hx799dmt4vdh2klh576pcfqv2rdxves3es9ka
creation_rules:
  # Read by every host: user password hash, tailscale key, ...
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *user-riad
